# ---------------------------------------------------------------------------
# Obsidian RAG configuration
# This is the ONE place to change your vault location and models.
# ---------------------------------------------------------------------------

# Absolute path to your Obsidian vault (the folder full of .md notes).
# Windows: use forward slashes or double backslashes.
vault_path: "D:/kame-house"

# Local HuggingFace embedding model (used for retrieval).
# Runs on your machine, downloaded once. Change this to swap embeddings,
# then re-run `python scripts/index.py`.
embedding_model: "BAAI/bge-small-en-v1.5"

# Local Ollama model used to generate answers (run `ollama pull <name>` first).
# Change this to swap the LLM -- no re-indexing needed.
# Small default for CPU-only machines; if you have the RAM/GPU, try
# "qwen2.5:7b-instruct" or "llama3.1:8b".
llm_model: "qwen2.5:3b-instruct"

# Where the Ollama server listens (its default).
ollama_base_url: "http://localhost:11434"

# Chunking: how notes are split before embedding.
chunk_size: 512
chunk_overlap: 64

# How many note chunks to retrieve per question.
top_k: 5

# Where the persisted Chroma index lives (created automatically).
storage_dir: "./storage"

# Chroma collection name.
collection_name: "obsidian"

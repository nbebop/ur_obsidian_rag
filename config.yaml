# ---------------------------------------------------------------------------
# Obsidian RAG configuration
# This is the ONE place to change your vault location and models.
# ---------------------------------------------------------------------------

# Absolute path to your Obsidian vault (the folder full of .md notes).
# Windows: use forward slashes or double backslashes.
vault_path: "D:/kame-house"

# Local HuggingFace embedding model (used for retrieval).
# Runs on your machine, downloaded once. Change this to swap embeddings,
# then re-run `python scripts/index.py`.
embedding_model: "BAAI/bge-small-en-v1.5"

# HuggingFace Inference API model (used to generate answers).
# Any text-generation model served by the HF Inference API works.
# Change this to swap the LLM -- no re-indexing needed.
# This default is ungated (no terms to accept). Gated alternatives like
# meta-llama/Llama-3.2-3B-Instruct also work once you accept their terms on HF.
llm_model: "mistralai/Mistral-7B-Instruct-v0.3"

# Which HuggingFace inference provider serves the LLM.
# "auto" lets HF route to whichever provider hosts the model (recommended).
# Requires a token with the "Inference Providers" permission enabled.
# Other values: hf-inference, together, novita, fireworks-ai, nebius, ...
llm_provider: "auto"

# Chunking: how notes are split before embedding.
chunk_size: 512
chunk_overlap: 64

# How many note chunks to retrieve per question.
top_k: 5

# Where the persisted Chroma index lives (created automatically).
storage_dir: "./storage"

# Chroma collection name.
collection_name: "obsidian"
